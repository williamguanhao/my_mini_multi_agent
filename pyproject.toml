[project]
name = "mini_agent"
version = "0.1.0"
requires-python = ">=3.11"

dependencies = [
    "openai>=1.0",
    "python-dotenv>=1.0",
    "yfinance>1.1",
    "mcp[cli]>=1.0",
]

[project.scripts]
mini-agent = "mini_agent.main:main"
agent-eval = "mini_agent.run_eval:main"

[tool.setuptools]
packages = ["mini_agent", "graph"]
