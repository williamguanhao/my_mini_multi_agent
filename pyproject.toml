[project]
name = "mini_agent"
version = "0.5.0"
requires-python = ">=3.11"

dependencies = [
    "openai>=1.0",
    "python-dotenv>=1.0",
    "yfinance>1.1",
    "mcp[cli]>=1.0,<2",
]

[project.scripts]
mini-agent = "mini_agent.main:main"
agent-eval = "mini_agent.run_eval:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.uv.workspace]
members = [
    "mcp_servers/yfinance",
    "mcp_servers/fred",
    "mcp_servers/websearch",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
extend-exclude = ["notebooks"]  # teaching artifacts, not production code

[tool.ruff.lint]
# Pragmatic starter set: real bugs (F), basic pycodestyle (E4/E7/E9), import hygiene (I).
select = ["E4", "E7", "E9", "F", "I"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mini_agent", "graph"]
